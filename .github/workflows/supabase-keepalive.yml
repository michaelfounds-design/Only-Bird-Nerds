name: Supabase keepalive

# Supabase's free tier auto-pauses a project after 7 days with no API
# activity. This just hits the REST endpoint on a schedule so the project
# always sees a request well inside that window.

on:
  schedule:
    - cron: '0 13 * * 1,4'  # Mondays & Thursdays, 13:00 UTC
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://xztnsuiyimhgsuoosdfp.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_otg8GcWo5xOOUTOyet9Htg_CepqJwEG")
          echo "Supabase responded with HTTP $code"
          # 200/401/404 all mean the project is up and answered; anything
          # else (e.g. a curl failure code or a timeout) should fail the job.
          if [ "$code" != "200" ] && [ "$code" != "401" ] && [ "$code" != "404" ]; then
            echo "Unexpected response — project may be paused or unreachable."
            exit 1
          fi
